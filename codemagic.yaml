workflows:
  deploy-stg:
    name: Stage → Google Play Store-Internal Test
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - Picke
      android_signing:
        - picke_keystore
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "develop"
          include: true
        - pattern: "release-stg-*"
          include: true
    scripts:
      - name: 비밀 자산 주입
        script: |
          # 하나라도 실패하면 즉시 중단
          set -e

          # [google-services.json 복원]
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

          # [local.properties 재생성]
          # local.properties는 .gitignore 대상이라 GitHub에 없음 → Codemagic 환경변수로 직접 작성
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT

          # 서명 정보: Codemagic Code Signing Identities에서 자동 주입
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD

          # 외부 서비스 API 키
          KAKAO_DEBUG_APPKEY=$KAKAO_DEBUG_APPKEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          ADMOB_APP_ID=$ADMOB_APP_ID
          ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED_AD_UNIT_ID
          MIXPANEL_PROJECT_TOKEN=$MIXPANEL_PROJECT_TOKEN
          EOF
      - name: 릴리스 노트 수집
        script: |
          VER=$(grep 'versionName' app/build.gradle.kts | grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' | tr -d '"' | head -1)
          BODY=$(cat release_notes.txt 2>/dev/null)
          [ -z "$BODY" ] && BODY="- 버그 수정"
          NOTES="[v${VER}]
          ${BODY}"
          echo "RELEASE_NOTES<<__EOF__" >> "$CM_ENV"
          echo "$NOTES" >> "$CM_ENV"
          echo "__EOF__" >> "$CM_ENV"
          echo "릴리스 노트:"; echo "$NOTES"
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🛠️ **Picke** Google Play Store 내부테스트(QA) 빌드 시작 · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: AAB 빌드 (Release)
        script: |
          set -e
          sed -i '' "s/versionCode = [0-9]*/versionCode = $BUILD_NUMBER/" app/build.gradle.kts
          ./gradlew bundleRelease
      # - name: Discord 성공 알림 + 릴리스 노트
      #   script: |
      #     python3 - <<'PY'
      #     import os, json, urllib.request
      #     msg = "\n"
      #     msg += f"✅ **Picke** Google Play Store 내부테스트(QA) 배포 완료 · #{os.environ.get('BUILD_NUMBER','')}"
      #     notes = os.environ.get('RELEASE_NOTES','').strip()
      #     if notes: msg += "\n" + notes
      #     url = os.environ.get('CM_BUILD_URL','')
      #     if url: msg += "\n" + url
      #     wh = os.environ.get('DISCORD_WEBHOOK','')
      #     if wh:
      #         req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
      #                                      headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
      #         try: urllib.request.urlopen(req); print("discord ok")
      #         except Exception as e: print("discord skip:", e)
      #     PY
    artifacts:
      - app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_JSON_KEY
        track: internal

  deploy-prod:
    name: Prod → Google Play Store
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - Picke
      android_signing:
        - picke_keystore
    triggering:
      # 실제 Google Play Store 제출이라 v* 태그로만 트리거
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: 비밀 자산 주입
        script: |
          # 하나라도 실패하면 즉시 중단
          set -e

          # [google-services.json 복원]
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

          # [local.properties 재생성]
          # local.properties는 .gitignore 대상이라 GitHub에 없음 → Codemagic 환경변수로 직접 작성
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT

          # 서명 정보: Codemagic Code Signing Identities에서 자동 주입
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD

          # 외부 서비스 API 키
          KAKAO_DEBUG_APPKEY=$KAKAO_DEBUG_APPKEY
          GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID
          ADMOB_APP_ID=$ADMOB_APP_ID
          ADMOB_REWARDED_AD_UNIT_ID=$ADMOB_REWARDED_AD_UNIT_ID
          MIXPANEL_PROJECT_TOKEN=$MIXPANEL_PROJECT_TOKEN
          EOF
      - name: 릴리스 노트 수집
        script: |
          # git 태그(v1.2.0)에서 v를 제거해 versionName으로 사용
          VER="${CM_TAG#v}"
          BODY=$(cat release_notes.txt 2>/dev/null)
          [ -z "$BODY" ] && BODY="- 버그 수정"
          NOTES="[v${VER}]
          ${BODY}"
          echo "RELEASE_NOTES<<__EOF__" >> "$CM_ENV"
          echo "$NOTES" >> "$CM_ENV"
          echo "__EOF__" >> "$CM_ENV"
          echo "RELEASE_VERSION=$VER" >> "$CM_ENV"
          echo "릴리스 노트:"; echo "$NOTES"
      - name: Discord 빌드 시작 알림
        script: |
          python3 - <<'PY'
          import os, json, urllib.request
          msg = f"🚀 **Picke** Google Play Store (Prod) 빌드 시작 · {os.environ.get('RELEASE_VERSION','')} · #{os.environ.get('BUILD_NUMBER','')}\n{os.environ.get('CM_BUILD_URL','')}"
          wh = os.environ.get('DISCORD_WEBHOOK','')
          if wh:
              req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
                                           headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
              try: urllib.request.urlopen(req); print("discord ok")
              except Exception as e: print("discord skip:", e)
          PY
      - name: AAB 빌드 (Release)
        script: |
          set -e
          # versionCode는 Codemagic 빌드번호로, versionName은 git 태그로 자동 주입
          sed -i '' "s/versionCode = [0-9]*/versionCode = $BUILD_NUMBER/" app/build.gradle.kts
          sed -i '' "s/versionName = \"[^\"]*\"/versionName = \"$RELEASE_VERSION\"/" app/build.gradle.kts
          ./gradlew bundleRelease
      # - name: Discord 성공 알림 + 릴리스 노트
      #   script: |
      #     python3 - <<'PY'
      #     import os, json, urllib.request
      #     msg = f"\n🚀 **Picke** {os.environ.get('RELEASE_VERSION','')} Google Play Store 출시 완료 · #{os.environ.get('BUILD_NUMBER','')}"
      #     notes = os.environ.get('RELEASE_NOTES','').strip()
      #     if notes: msg += "\n" + notes
      #     url = os.environ.get('CM_BUILD_URL','')
      #     if url: msg += "\n" + url
      #     wh = os.environ.get('DISCORD_WEBHOOK','')
      #     if wh:
      #         req = urllib.request.Request(wh, data=json.dumps({"content": msg}).encode(),
      #                                      headers={"Content-Type":"application/json","User-Agent":"Picke-CI/1.0"})
      #         try: urllib.request.urlopen(req); print("discord ok")
      #         except Exception as e: print("discord skip:", e)
      #     PY
    artifacts:
      - app/build/outputs/bundle/release/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_JSON_KEY
        track: production